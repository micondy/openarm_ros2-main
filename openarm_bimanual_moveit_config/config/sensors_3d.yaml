# This file is used to configure the 3D sensors for the robot.
# It is a placeholder for now. Configure the sensors to use the correct topics and parameters.
sensors:
  - default_sensor1
default_sensor:
  far_clipping_plane_distance: 5.0
  filtered_cloud_topic: filtered_cloud
  image_topic: /camera/camera/aligned_depth_to_color/image_raw
  
  near_clipping_plane_distance: 0.2
  far_clipping_plane_distance: 2.0

  padding_offset: 0.02
  padding_scale: 1.5

  queue_size: 5
  max_update_rate: 5.0

  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  shadow_threshold: 0.2
